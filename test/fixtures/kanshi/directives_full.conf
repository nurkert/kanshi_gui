# Every output directive kanshi(5) documents, plus the criteria forms the
# parser does not model. Nothing here is exotic — it is all in the manual.

output "Foocorp ASDF 1234" alias $desk-main

profile everything {
    output $desk-main enable mode preferred position 0,0 adaptive_sync on
    output "Foocorp ASDF *" enable mode --custom 1280x720@60Hz position 1280,0
    output eDP-1 enable transform flipped-90 scale 1.5 position 2560,0
    output HDMI-A-1 disable
}

profile wildcard-catchall {
    output * enable
}

profile ellipsis {
    ...output "Barcorp Unknown Unknown" enable
}
