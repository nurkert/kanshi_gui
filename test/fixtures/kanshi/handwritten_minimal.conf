# A hand-written config in the shortest form kanshi accepts.
#
# `enable` is OPTIONAL in kanshi's DSL — an output listed without it is
# configured, not skipped. kanshi_gui's line-based parser requires the
# keyword (kanshi_config_parser.dart:382), so every profile here parses as
# zero monitors, and KanshiConfigWriter.render skips profiles with no
# monitors (kanshi_config_writer.dart:87). Saving therefore deletes the
# entire file.
#
# This fixture is the regression guard for that data loss.

profile docked {
    output eDP-1 position 0,0
    output DP-1 position 1920,0
}

profile solo {
    output eDP-1 position 0,0
}
