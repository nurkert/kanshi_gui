profile 'Home Office' {
    output 'eDP-1' enable scale 0.76 mode 1920x1080@60Hz transform normal position 0,0
    output 'DP-1' enable scale 1.00 mode 3440x1440@49.987Hz transform normal position 2526,0
    output 'HDMI-A-2' enable scale 1.00 mode 1920x1080@60Hz transform 270 position 5966,0
    # kanshi_gui:edid 'eDP-1'='ExampleCorp Internal 0x0000'
    # kanshi_gui:edid 'DP-1'='ExampleCorp Ultrawide SERIAL0001'
    # kanshi_gui:edid 'HDMI-A-2'='ExampleCorp Portrait SERIAL0002'
    exec echo "Home Office" > ~/.current_kanshi_profile
}

profile 'Laptop' {
    output 'eDP-1' enable scale 1.00 mode 1920x1080@60Hz transform normal position 0,0
    # kanshi_gui:edid 'eDP-1'='ExampleCorp Internal 0x0000'
    exec echo "Laptop" > ~/.current_kanshi_profile
}
