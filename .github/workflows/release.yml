name: Build and Release Debian Packages

# Releases are cut from an annotated tag, never from a branch push. Before
# v2.0 this workflow ran on every push to main, so an unreviewed commit —
# and, because no CI gate existed, an untested one — published a .deb and
# moved the "latest" release. Tagging makes publishing a deliberate act.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }} package
    runs-on: ${{ matrix.runner }}
    # Build inside Debian Bullseye so the resulting binaries link against
    # glibc 2.31 — that makes the .deb run on Pi OS Bullseye, Debian 11,
    # Ubuntu 20.04 and anything newer. Without this the runner's glibc
    # (2.35 on ubuntu-22.04-arm, 2.39 on ubuntu-latest) leaks into the
    # binary and breaks installs on older arm64 boards.
    container: debian:bullseye-slim
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-22.04-arm

    steps:
      # bullseye-slim ships without git/curl/etc., which actions/checkout
      # and the Flutter installer both expect to be present.
      # Retried, because a Debian mirror hiccup here burns a version number:
      # the release job needs both architectures, and `allowUpdates: false`
      # means a tag that failed cannot be re-published — it has to be
      # abandoned and the version bumped. That is what happened to 2.1.5+49.
      - name: Bootstrap container tools
        run: |
          # Bullseye left LTS on 2026-08-31, and its security repository has
          # since been taken off deb.debian.org: the index is still served,
          # its Release file has expired, and the .deb files under it are
          # gone. The image itself was built from that repository, so nothing
          # depending on an installed package (perl, sudo, xz) can be
          # installed any more — the container could not even get git, and
          # the 2.3.3 release died here.
          #
          # The image carries the answer in its own sources.list: commented
          # snapshot.debian.org lines pinned to the day it was built. Those
          # never move and never expire. Switch to them.
          sed -i 's|^# deb http://snapshot|deb http://snapshot|; s|^deb http://deb.debian.org|# deb http://deb.debian.org|' /etc/apt/sources.list
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99-snapshot
          for attempt in 1 2 3; do
            apt-get update && apt-get install -y --no-install-recommends \
              git curl ca-certificates xz-utils unzip sudo && exit 0
            echo "attempt $attempt failed, retrying in 15s" >&2
            sleep 15
          done
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      # The container runs as root while the workspace is owned by a
      # different uid — git refuses to operate on it without this opt-in.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory '*'

      - name: Install build dependencies
        run: |
          for attempt in 1 2 3; do
            apt-get install -y --no-install-recommends \
              clang cmake ninja-build pkg-config \
              libgtk-3-dev liblzma-dev dpkg-dev libstdc++-10-dev && exit 0
            echo "attempt $attempt failed, retrying in 15s" >&2
            apt-get update || true
            sleep 15
          done
          exit 1

      - name: Install Flutter
        run: |
          git clone --depth 1 https://github.com/flutter/flutter.git -b stable "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version
          "$HOME/flutter/bin/flutter" config --enable-linux-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Debian package
        run: scripts/build_deb.sh --arch ${{ matrix.arch }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: build/kanshi-gui_*_${{ matrix.arch }}.deb
          # The default is `warn`: a glob that matches nothing produces a
          # green step, and the release job then publishes a "latest" release
          # with no package in it. Since allowUpdates is false, that empty
          # release cannot be corrected under the same tag — the version would
          # have to be burned. Fail here instead.
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The tag is the source of truth for what gets published; pubspec.yaml
      # is the source of truth for what got built. If they disagree, the
      # release would advertise a version the binaries do not carry, so fail
      # loudly instead of publishing a mislabelled artifact.
      - name: Determine and verify version
        id: version
        run: |
          version=$(awk -F': ' '/^version:/{print $2}' pubspec.yaml)
          tag="${GITHUB_REF_NAME}"
          echo "pubspec version: $version"
          echo "tag:             $tag"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag '$tag' does not match pubspec.yaml version '$version' (expected 'v$version')."
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist

      # The release page used to go out with an empty body, so the one place
      # a user checks before upgrading said nothing about what changed — and
      # 2.0.1 in particular exists to tell them 2.0.0 was unusable.
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${{ steps.version.outputs.value }}"
          # The heading carries the marketing version only ("## 2.0.1"), while
          # the tag carries the build number too ("v2.0.1+41").
          heading="${version%%+*}"
          awk -v want="## $heading" '
            $0 == want {found = 1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG.md section for '$heading'." > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          artifacts: dist/*.deb
          artifactErrorsFailBuild: true
          bodyFile: RELEASE_NOTES.md
          # No allowUpdates: re-running against an existing release used to
          # replace its binaries in place, so the tag and the published .deb
          # could end up describing different commits. Publishing twice for
          # the same version is now an error, which is the honest outcome.
          allowUpdates: false
          makeLatest: true
